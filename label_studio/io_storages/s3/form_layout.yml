# 1x3 grid
title_bucket_prefix: &title_bucket_prefix
  - type: text
    name: title
    label: 存储标题
  - type: text
    name: bucket
    label: 存储桶名称
    required: true
  - type: text
    name: prefix
    label: 存储桶前缀

# 2x3 grid
aws_params_import: &aws_params_import
  - type: text
    name: region_name
    label: Region Name
    placeholder: us-east-1
  - type: text
    name: s3_endpoint
    label: S3 Endpoint
  - null
  - type: password
    name: aws_access_key_id
    label: Access Key ID
    autoComplete: "off"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_secret_access_key
    label: Secret Access Key
    autoComplete: "new-password"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_session_token
    autoComplete: "new-password"
    label: Session Token
    skipAutofill: true
    allowEmpty: true
    protectedValue: true

# 2x3 grid
aws_params_export: &aws_params_export
  - type: text
    name: region_name
    label: 域名称
    placeholder: us-east-1
  - type: text
    name: s3_endpoint
    label: S3终端节点
  - type: text
    name: aws_sse_kms_key_id
    label: SSE KMS Key ID
  - type: password
    name: aws_access_key_id
    label: 访问密钥ID
    autoComplete: "off"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_secret_access_key
    label: 密码
    autoComplete: "new-password"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_session_token
    autoComplete: "new-password"
    label: 会话Token
    skipAutofill: true
    allowEmpty: true
    protectedValue: true


ImportStorage:
  # Title, Bucket, Prefix
  - columnCount: 3
    fields: *title_bucket_prefix
  # Regex filter
  - columnCount: 1
    fields:
      - type: text
        name: regex_filter
        label: 文件筛选器正则表达式
        placeholder: '.*csv or .*(jpe?g|png|tiff) or .\w+-\d+.text'
        validators:
          - regexp
  # AWS specific params
  - columnCount: 3
    fields: *aws_params_import

  # 2 columns grid
  - columnCount: 2
    columns:
      - width: 345
        fields:
          - type: toggle
            name: use_blob_urls
            label: 将每个bucket对象视为源文件
            description: 如果未选中，则将每个bucket对象视为JSON格式的任务。可选
          - type: toggle
            name: recursive_scan
            label: 递归扫描
            description: 对存储桶内容执行递归扫描
      - fields:
          - type: toggle
            name: presign
            label: 使用预签名URL
            value: true
          - type: counter
            name: presign_ttl
            label: 过期时间（分钟）
            min: 1
            value: 15
            dependency: presign

ExportStorage:
  - columnCount: 3
    fields: *title_bucket_prefix
  - columnCount: 3
    fields: *aws_params_export
  # 1 columns grid
  - columnCount: 1
    columns:
      - width: 345
        fields:
          - type: toggle
            name: can_delete_objects
            label: Can delete objects from storage
            description: If unchecked, annotations will not be deleted from storage
