# 1x3 grid
title_bucket_prefix: &title_bucket_prefix
  - type: text
    name: title
    label: 存储标题
  - type: text
    name: bucket
    label: 存储桶名称
    required: true
  - type: text
    name: prefix
    label: 存储桶前缀

gcs_credentials: &gcs_credentials
  - type: password
    name: google_application_credentials
    label: Google应用程序凭据，留空以使用默认凭据（ADC）
    placeholder: Paste the contents of credentials.json here OR leave blank to use ADC
    autoComplete: "new-password"
    skipAutofill: true
    allowEmpty: false
    validators:
      - json

project_id: &project_id
  - type: text
    name: google_project_id
    label: 谷歌项目ID
    placeholder: '留空以继承Google应用程序凭据...'

ImportStorage:
  # Title, Bucket, Prefix
  - columnCount: 3
    fields: *title_bucket_prefix
  # Regex filter
  - columnCount: 1
    fields:
      - type: text
        name: regex_filter
        label: 文件筛选器正则表达式
        placeholder: '.*csv or .*(jpe?g|png|tiff) or .\w+-\d+.text'
        validators:
          - regexp

  # 2 columns grid
  - columnCount: 2
    columns:
      - width: 345
        fields:
          - type: toggle
            name: use_blob_urls
            label: 将每个bucket对象视为源文件
            description: 如果未选中，则将每个bucket对象视为JSON格式的任务。可选
      - fields:
          - type: toggle
            name: presign
            label: 使用预签名URL
            value: true
          - type: counter
            name: presign_ttl
            label: 过期时间（分钟）
            min: 1
            value: 15
            dependency: presign

  # GCS credentials
  - columnCount: 1
    fields: *gcs_credentials
  # Project ID
  - columnCount: 1
    fields: *project_id

ExportStorage:
  - columnCount: 3
    fields: *title_bucket_prefix
  - columnCount: 1
    fields: *gcs_credentials
  # Project ID
  - columnCount: 1
    fields: *project_id
